name: TimelyInvoices cron

on:
  schedule:
    # Every 6 hours UTC
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  hit-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Recurring invoices
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repo secret is missing" >&2
            exit 1
          fi
          curl -fsS -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://timelyinvoices.com/api/cron/recurring"

      - name: Collections reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://timelyinvoices.com/api/cron/collections"
